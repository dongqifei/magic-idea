name: 'publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            pkg_target: macos-arm64
            bin_name: idea-server-aarch64-apple-darwin
          - platform: 'windows-latest'
            args: ''
            pkg_target: win-x64
            bin_name: idea-server-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm cli

      # ========== 编译TS代码 + pkg生成对应架构idea-server ==========
      - name: Build TS & Generate idea-server binary
        run: |
          npx tsc
          npx tsc-alias
          npx pkg ./dist/index.js --target ${{ matrix.pkg_target }} --output src-tauri/binaries/${{ matrix.bin_name }}
        shell: bash

      # 执行tauri打包
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY_TEXT }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PWD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Magic IDEA v__VERSION__'
          releaseBody: '修复了若干问题，提升了稳定性。'
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
          